<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | IndraSphere</title><style>body{margin:0;background:#f3f5f8;color:#18202b;font-family:Arial,"Noto Sans Devanagari",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.head{background:#fff;border-bottom:1px solid #ddd;padding:18px}.logo{font-size:28px;font-weight:900}.logo span{color:#d71920}a{color:#d71920;text-decoration:none}.article{background:#fff;border-radius:14px;padding:28px;margin-top:20px}.label{color:#d71920;font-weight:800;font-size:13px}.title{font-size:42px;line-height:1.15;margin:10px 0 15px}.meta{color:#667085;font-size:13px}.content{font-size:18px;line-height:1.8;margin-top:25px;white-space:pre-wrap}.back{display:inline-block;margin-bottom:10px}@media(max-width:700px){.title{font-size:30px}.article{padding:20px}.content{font-size:17px}}</style></head><body><header class="head"><div class="wrap"><div class="logo">Indra<span>Sphere</span></div></div></header><main class="wrap"><a class="back" href="index.html">← होम पर वापस</a><article class="article" id="article">लोड हो रहा है…</article></main><script>function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let id=new URLSearchParams(location.search).get('id');let list=[];try{list=JSON.parse(localStorage.getItem('indrasphere_news')||'[]')}catch(e){};if(id==='welcome'||!id){list.unshift({id:'welcome',title:'खबर सिर्फ खबर नहीं — उसके पीछे की पूरी कहानी समझिए',category:'Featured',summary:'IndraSphere पर ताज़ा घटनाओं के साथ उनका संदर्भ, उपलब्ध तथ्य और अलग-अलग दृष्टिकोण पढ़ें।',content:'यह IndraSphere का पहला featured article है। यहां से आप अपनी खबरों को विस्तार से प्रकाशित कर सकते हैं।',date:'आज'})}let n=list.find(x=>x.id===id)||list[0];document.getElementById('article').innerHTML=n?`<div class="label">${esc(n.category||'NEWS')}</div><h1 class="title">${esc(n.title)}</h1><div class="meta">${esc(n.date||'आज')} • ${esc(n.author||'IndraSphere Desk')}</div><p class="content">${esc(n.content||n.summary||'')}</p>`:'<h2>खबर नहीं मिली</h2>';</script></body></html>
